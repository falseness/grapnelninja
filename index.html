<!Doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <title></title>
        <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <script src = "i18n.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

        <style>
            body 
            {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: black;
            }
            body, canvas
            {
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                touch-action: none;
                -webkit-tap-highlight-color: transparent;
            }
            /* Game canvas and letterbox bars; turned to landscape on an upright
               phone (configureStage). Fixed children are placed in it. */
            #stage
            {
                position: fixed;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                transform-origin: center center;
            }
            /* Letterbox bars behind the game canvas (placed by configureWindowBackground) */
            .window-bar
            {
                position: fixed;
                pointer-events: none;
            }
            #loading
            {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: black;
                color: white;
                font-family: sans-serif;
                z-index: 1;
            }
            #loading[hidden]
            {
                display: none;
            }
            #rotate-prompt { display: none; }
            @media (pointer: coarse) and (orientation: portrait) {
                #stage { visibility: hidden; }
                #rotate-prompt {
                    position: fixed; inset: 0; z-index: 2; display: flex;
                    align-items: center; justify-content: center;
                    box-sizing: border-box; padding: 32px; text-align: center;
                    background: #080322; color: #bfffff; font: 24px/1.5 sans-serif;
                }
            }
            #loading-title
            {
                font-size: 48px;
            }
            #loading-progress
            {
                margin-top: 16px;
                font-size: 20px;
                color: #aaa;
            }
        </style>
    </head>
    <body>
        <div id = "loading">
            <div id = "loading-title" data-i18n = "game.title"></div>
            <div id = "loading-progress" data-i18n = "loading.initial"></div>
            <button id="boot-retry" hidden data-i18n="loading.retry" onclick="this.disabled = true; location.reload()"></button>
        </div>
        <div id="rotate-prompt" role="status" data-i18n="orientation.rotate"></div>
        <script>I18N.applyDom()</script>
        <div id = "stage">
            <canvas class = "window-bar" hidden></canvas>
            <canvas class = "window-bar" hidden></canvas>
            <canvas id = "canvas"></canvas>
        </div>
        <script src = "gameoptions.js"></script>
        <script src = "style.js"></script>
        <script src = "render/glowsprites.js"></script>
        <script src = "platform.js"></script>
        <script src = "telemetry.js"></script>
        <script src = "progress.js"></script>
        <script src = 'menu.js'></script>
        <script src = "languagebutton.js"></script>
    
        <script src = "collision/circlewithcircle.js"></script>
        <script src = "collision/linewithline.js"></script>
        <script src = "collision/circlewithline.js"></script>
        <script src = "collision/broadphase.js"></script>
        
        <script src = "elements/factory.js"></script>
        <script src = "elements/momentumcourse.js"></script>
        <script src = "render/culling.js"></script>
        <script src = "sprites/floor.js"></script>
        
        <script src = "sprites/empty.js"></script>
        <script src = "sprites/element.js"></script>
        
        <script src = "sprites/ninja.js"></script>
        <script src = "sprites/grapnel.js"></script>
        
        <script src = "sprites/rect.js"></script>
        <script src = "sprites/jumpingcube.js"></script>
        
        <script src = "sprites/scoretext.js"></script>

        <script src = "sprites/triangle.js"></script>
        <script src = "sprites/trampoline.js"></script>
        <script src = "sprites/side.js"></script>
        <script src = "sprites/leftwall.js"></script>
        <script src = "elements/momentumborders.js"></script>
        
        <script src = "physics.js"></script>
        <script src = "respawn.js"></script>
        
        <script src = "moveScreen.js"></script>
        
        <script src = "render/effects.js"></script>
        <script src = "render/tutorialhint.js"></script>
        <script src = "render/backdrop.js"></script>
        <script src = "render/draw.js"></script>
        <script src = "render/perfprofile.js"></script>
        <script src = "render/abswitches.js"></script>
        
        <script src = "events.js"></script>
        <script>
            'use strict'
            let canvas = document.getElementById('canvas')
            let ctx
            let ok = false
            let time
            let trackEnabled = true
            let fpsCounter
            let menu
            let continueOffer
            // A pause request during an ad is applied to the next run.
            let hostPaused = false
            let pauseAfterAd = false
            // A full-screen ad is on top: gameplay and input are frozen
            let adOpen = false
            // The run ended in a death: leaving it (Restart, mode switch) shows an
            // interstitial first
            let runOver = false
            // level_started was sent and no terminal event has followed yet
            let runInProgress = false
            // An interstitial was requested: gameplay and input wait for it
            let interstitialPending = false
            let ninja, grapnel, floors, elementsFactory, screen, version, visualEffects, firstCycleInThisTick = true, unTouch = false
            // A mouse button / finger is down; a press held across a fast
            // restart is stale and throws no grapnel until it is released
            let pressHeld = false, stalePress = false
            const physicsTiming = {lastFrameTime: 0, accumulatorMs: 0}
            
            let game
            
            let bootPromise
            let bootComplete = false
            boot()
            
            // Platform init -> one storage read -> canvas setup -> hide the
            // loading overlay -> attach input -> start a main-version run ->
            // paint its first frame -> game_ready. Earlier clicks and keys are
            // ignored until input is attached.
            function boot()
            {
                if (!bootPromise)
                    bootPromise = bootApplication().catch(error =>
                    {
                        cancelAnimationFrame(game)
                        // Pause handlers must not draw over the retry screen
                        bootComplete = false
                        console.error('Application boot failed', error)
                        document.getElementById('loading').hidden = false
                        setLoadingProgress(I18N.t('loading.failed'))
                        const retry = document.getElementById('boot-retry')
                        retry.textContent = I18N.t('loading.retry')
                        retry.hidden = false
                    })
                return bootPromise
            }
            async function bootApplication()
            {
                setLoadingProgress(I18N.t('loading.connecting'))
                await PLATFORM.init()
                ctx = canvas.getContext('2d', {alpha: false})
                ctx.lineCap = 'butt'
                fpsCounter = new FpsCounter()
                menu = new Menu(width, height)
                continueOffer = new ContinueOffer(width, height, switchFromOffer, restartFromOffer)
                // Platform language until the saved choice is read
                I18N.language = I18N.pick(null, PLATFORM.language)
                setLoadingProgress(I18N.t('loading.progress'))
                PROGRESS.load(await PLATFORM.storage.getMany(PROGRESS.keys))
                I18N.language = I18N.pick(PROGRESS.getLang(), PLATFORM.language)
                applyLanguage()
                setLoadingProgress(I18N.t('loading.starting'))
                await nextFrame()
                start()
                document.getElementById('loading').hidden = true
                createEvents()
                bootComplete = true
                // Every launch skips the title menu and starts a main-version
                // run. Its level_started waits in PLATFORM's lifecycle queue
                // until game_ready has been delivered.
                const shouldPause = hostPaused || isViewRotated() || document.visibilityState === 'hidden'
                startGame('bad')
                if (shouldPause)
                {
                    draw()
                    menu.startPause()
                }
                // After the run exists: a portrait boot is already paused, so
                // no level_paused goes out ahead of level_started.
                updateOrientation()
                // The first gameplay frame runs in the next animation frame;
                // the one after it follows its paint.
                await nextFrame()
                await nextFrame()
                PLATFORM.gameReady()
            }
            function setLoadingProgress(text)
            {
                document.getElementById('loading-progress').textContent = text
            }
            function nextFrame()
            {
                return new Promise(resolve => requestAnimationFrame(resolve))
            }
            
            function startGame(_v)
            {
                reuseTimeInGame()
                resetPhysicsTiming()
                trackEnabled = true
                version = _v
                PLATFORM.startup('mode_selected', version)
                visualEffects.background.randomSequenceScenes = 0
                visualEffects.screenEffects.landings.length = 0

                chooseVersion()
                PLATFORM.startup('run_initialized', version)
                warmGlowSprites()
                
                cancelAnimationFrame(game)
                game = requestAnimationFrame(gameLoop)
            }
            function chooseVersion()
            {
                firstCycleInThisTick = true
                runOver = false
                pauseAfterAd = false
                scoreText.recordAnnounced = false
                continueOffer.hide()
                
                layoutHud()
                
                scoreText.count[version] = 0
                PLATFORM.sendLifecycle('level_started', {world: version})
                runInProgress = true
                TUTORIAL_HINT.runStarted()
                
                if (version == 'classic')
                    startClassicVersion()
                else if (version == 'bad')
                    startBadVersion()
                else if (version == 'momentum')
                    startMomentumVersion()
                else
                    console.log('error version in startGame()')
            }
            // Width-derived HUD values: score text and the menu button.
            function layoutHud()
            {
                scoreText.x         = scoreTextX()      / scale[version]
                scoreText.rx        = scoreTextRx()     / scale[version]
                scoreText.y         = scoreTextY        / scale[version]
                scoreText.fontSize  = getHudFontSize(width / scale[version], height / scale[version], version)
                const menuButtonLayout = getHudMenuButtonLayout(
                    width / scale[version],
                    height / scale[version],
                    version,
                    {
                        x: menu.constButton.x / scale[version],
                        y: menu.constButton.y / scale[version],
                        width: menu.constButton.width / scale[version],
                        height: menu.constButton.height / scale[version]
                    }
                )
                // A touch target (44 CSS px) on phones, kept inside the corner
                const viewWidth = width / scale[version]
                const margin = LANGUAGE_BUTTON.marginRatio * height / scale[version]
                const size = Math.max(menuButtonLayout.width, minTouchSize() / scale[version])

                menu.button = new Button(
                {
                    x       : Math.min(menuButtonLayout.x, viewWidth - margin - size / 2),
                    y       : Math.max(menuButtonLayout.y, margin + size / 2),
                    width   : size,
                    height  : size,
                    fill    : menu.constButton.fill,
                    stroke  : menu.constButton.stroke
                },
                ...menu.args)
            }
            function reStart()
            {
                PROGRESS.save()
                reuseTimeInGame()
                if (visualEffects && ninja && screen)
                {
                    visualEffects.screenEffects.triggerDeath(ninja.x + screen.x, ninja.y + screen.y)
                    visualEffects.background.randomSequenceScenes = 0
                }
                chooseVersion()
            }
            // A death is waiting on the continue offer or the interstitial
            function isRunFrozen()
            {
                return continueOffer.visible || interstitialPending
            }
            // A death with a game over ad due freezes the run and offers free
            // restart or a mode switch (the ad plays on leaving it). Any other
            // death restarts the same mode at once, as before 8519216.
            function onLethalDeath()
            {
                if (continueOffer.visible || ninja.isInvulnerable() || interstitialPending)
                    return
                runOver = true
                pauseTimeInGame()
                PROGRESS.save()
                if (PLATFORM.isInterstitialDue())
                {
                    continueOffer.show()
                    return
                }
                PLATFORM.sendLifecycle('level_failed', {world: version})
                runInProgress = false
                runOver = false
                const shouldPause = pauseAfterAd || hostPaused || isViewRotated() || document.visibilityState === 'hidden'
                stalePress = pressHeld
                reStart()
                if (shouldPause)
                {
                    draw()
                    menu.startPause()
                }
                resetPhysicsTiming()
            }
            function restartFromOffer()
            {
                leaveFinishedRun(function()
                {
                    continueOffer.hide()
                    startRunPausedIfPending(reStart)
                    resetPhysicsTiming()
                })
            }
            // The death screen mode selector: the game over interstitial,
            // then a run in the picked mode
            function switchFromOffer(mode)
            {
                leaveFinishedRun(function()
                {
                    continueOffer.hide()
                    startRunPausedIfPending(() => startGame(mode))
                })
            }
            // Starts the next run and pauses it if a pause is owed: an ad
            // blurred the window, the host paused, the view is rotated or
            // the page is hidden. Read before start(), since chooseVersion
            // clears pauseAfterAd.
            function startRunPausedIfPending(start)
            {
                const shouldPause = pauseAfterAd || hostPaused || isViewRotated() || document.visibilityState === 'hidden'
                start()
                if (shouldPause)
                {
                    draw()
                    menu.startPause()
                }
            }
            // Game over interstitial: after a death, never mid-run, at most
            // once per PLATFORM.interstitialMinGapMs. next() runs once the
            // ad is closed, failed or skipped.
            function leaveFinishedRun(next)
            {
                if (interstitialPending)
                    return
                // A death, or abandoning a live run from the pause menu, ends
                // the run: one terminal event per level_started
                if (runOver || runInProgress)
                    PLATFORM.sendLifecycle('level_failed', {world: version})
                runInProgress = false
                if (!runOver)
                {
                    next()
                    return
                }
                interstitialPending = true
                continueOffer.setAdPending(true)
                const request = PLATFORM.showInterstitial('game_over')
                runOver = false
                request.then(() =>
                {
                    interstitialPending = false
                    continueOffer.setAdPending(false)
                    next()
                })
            }
            function startClassicVersion()
            {
                screen = new Screen(false)
                
                elementsFactory = new ElementsFactory
                floors =
                [
                    new SideFloor(0, 0.1 * height, [{type: 'side', chance: 100}]),
                    new Floor(0.1 * height, 0.9 * height, {min: 0.35 * width, max: 0.45 * width},
                    [
                        {type: 'verticalPairRects', chance: 35 },// 40 35 25
                        {type: 'harmlessTriangle', chance: 10},
                        {type: 'trampoline', chance: 30},
                        {type: 'twoTrampolines', chance: 25}
                    ]),
                    new SideFloor(0.9 * height, height, [{type: 'side', chance: 100}])
                ]
                
                ninja = new Ninja(
                {
                    x: 0.2 * width,
                    y: 0.2 * height,
                    radius: 0.01 * height,
                    fill: STYLE.colors.player.fill,
                    stroke: STYLE.colors.player.stroke
                })
                grapnel = new Grapnel(
                {
                    points: [0, 0, 0, 0],
                    stroke: STYLE.colors.player.cyan
                })

                
                for (let i = 0; i < floors.length; ++i)
                {
                    floors[i].generatePrimaryElements()
                }
            }
            function startBadVersion()
            {
                screen = new Screen(false, 0)
                
                elementsFactory = new ElementsFactory
                floors =
                [
                    new SideFloor(2 * height, 2.2 * height, [{type: 'ground', chance: 100}]),
                    new Floor(0.2 * height, 2 * height, {min: 0, max: 0}, badFrameCreations(), 1),
                    new SideFloor(0, 0.2 * height, [{type: 'side', chance: 100}])
                ]
                ninja = new Ninja(
                {
                    x: 0.2 * width,
                    y: 1.2 * height,
                    radius: 0.01 * height,
                    fill: STYLE.colors.player.fill,
                    stroke: STYLE.colors.player.stroke
                })
                grapnel = new Grapnel(
                {
                    points: [0, 0, 0, 0],
                    stroke: STYLE.colors.player.cyan
                })

                
                for (let i = 0; i < floors.length; ++i)
                {
                    floors[i].generatePrimaryElements()
                }
                
                const screenMargin = 0.1 * height
                screen.min = -(1.9 * height - height + screenMargin)
                screen.max = -(0 - screenMargin)
            }
            // The weighted bad-mode frame factories (sprites/floor.js picks one)
            function badFrameCreations()
            {
                return [
                        {type: 'frame1Elements', chance: 6},
                        {type: 'frame3Triangle', chance: 6},
                        {type: 'frame4Elements', chance: 6},
                        {type: 'frame5Rects', chance: 5},
                        {type: 'frame6Rects', chance: 5},
                        {type: 'frame7Elements', chance: 6},
                        {type: 'frame8Elements', chance: 5},
                        {type: 'frame10Elements', chance: 5},
                        {type: 'frame11Elements', chance: 5},
                        {type: 'frame12Elements', chance: 6},
                        {type: 'frame13Elements', chance: 6},
                        {type: 'frame14Rects', chance: 5}
                ]
            }
            // Momentum: course-driven borders (elements/momentumborders.js)
            // around the bad-mode obstacles until momentum obstacles replace them.
            let momentumCourse = null
            function startMomentumVersion()
            {
                screen = new Screen(false, 0)

                elementsFactory = new ElementsFactory
                const borders = GAMEPLAY.momentumBorders
                momentumCourse = new MomentumCourse(screen.getDeletionBorder(), borders.originY)
                const floorY = borders.originY + borders.halfWidth
                floors =
                [
                    new MomentumBorderFloor(momentumCourse, ['floor', 'ceiling'], floorY, floorY + borders.thickness),
                    new Floor(0.2 * height, 2 * height, {min: 0, max: 0}, badFrameCreations(), 1),
                    new MomentumBorderFloor(momentumCourse, ['wall'], 0, 0)
                ]
                ninja = new Ninja(
                {
                    x: 0.2 * width,
                    y: 1.2 * height,
                    radius: 0.01 * height,
                    fill: STYLE.colors.player.fill,
                    stroke: STYLE.colors.player.stroke
                })
                grapnel = new Grapnel(
                {
                    points: [0, 0, 0, 0],
                    stroke: STYLE.colors.player.cyan
                })

                for (let i = 0; i < floors.length; ++i)
                {
                    floors[i].generatePrimaryElements()
                }

                const screenMargin = 0.1 * height
                screen.min = -(1.9 * height - height + screenMargin)
                screen.max = -(0 - screenMargin)
            }
            function start()
            {
                configureCanvasViewport(canvas, ctx)
                configureWindowBackground()
                visualEffects = new VisualEffects(ctx, canvas)
                
            }

            function resetPhysicsTiming()
            {
                physicsTiming.lastFrameTime = 0
                physicsTiming.accumulatorMs = 0
            }

            function gameLoop(frameTime)
            {
                fpsCounter.frame(frameTime)
                const activelyPlaying = bootComplete && !menu.gamePaused &&
                    !continueOffer.visible && !adOpen && !interstitialPending && !hostPaused &&
                    !isViewRotated() && document.visibilityState !== 'hidden'
                TELEMETRY.frame(frameTime, activelyPlaying, version)

                if (menu.gamePaused)
                    resetPhysicsTiming()
                else if (continueOffer.visible)
                {
                    resetPhysicsTiming()
                    draw()
                    continueOffer.draw()
                }
                else if (adOpen || interstitialPending || hostPaused)
                {
                    resetPhysicsTiming()
                    draw()
                }
                else
                {
                    const steps = runFixedPhysics(frameTime)
                    if (activelyPlaying) TUTORIAL_HINT.advance(steps * physicsStepMs)
                    draw()
                    if (activelyPlaying) PLATFORM.startup('first_gameplay_frame', version)
                }
                game = requestAnimationFrame(gameLoop)
            }

            function runFixedPhysics(frameTime)
            {
                const steps = computePhysicsSteps(physicsTiming, frameTime)
                for (let i = 0; i < steps; i++)
                    physics()
                return steps
            }

            // Live re-layout when the iframe resizes (fullscreen toggle,
            // window resize). The current run keeps going: only width-derived
            // values are recomputed; the logical height (and physics) is fixed.
            let resizeTimer = null
            function onViewportResize()
            {
                resizeTimer = null
                if (!bootComplete) return
                const oldWidth = width
                updateLogicalViewport()
                configureCanvasViewport(canvas, ctx)
                configureWindowBackground()
                ctx.lineCap = 'butt'
                TUTORIAL_HINT.invalidate()
                rebuildMenu()
                continueOffer.layout(width, height)

                if (version && screen)
                {
                    screen.updateWidthLayout()
                    screen.leftWall.update(screen)
                    layoutHud()
                    // Factories capture width-derived sizes; they hold no run state.
                    elementsFactory = new ElementsFactory
                    for (let i = 0; i < floors.length; ++i)
                        floors[i].rescaleSpacing(width / oldWidth)
                }

                redrawOverlays()
            }
            // Language toggle: switch now, re-lay out every screen, save the choice
            function setLanguage(lang)
            {
                I18N.language = lang
                applyLanguage()
                PROGRESS.setLang(I18N.language)
                PROGRESS.save()
                redrawOverlays()
            }
            // The loop is stopped under the pause and death screens: after a
            // re-layout or relabel, redraw them so what is drawn matches the
            // new buttons' hit boxes. (Also after a late storage reconcile.)
            function redrawOverlays()
            {
                if (!menu.gamePaused && !continueOffer.visible)
                    return
                draw()
                if (continueOffer.visible)
                    continueOffer.draw()
                if (menu.gamePaused)
                    menu.drawPauseScreen()
            }
            // Text in the current language everywhere: page, menu, offer
            function applyLanguage()
            {
                I18N.applyDom()
                TUTORIAL_HINT.invalidate()
                document.documentElement.lang = I18N.language
                rebuildMenu()
                continueOffer.relabel(width, height)
            }
            // A new Menu at the new size that keeps the current menu state;
            // its texts come from the current language and progress.
            function rebuildMenu()
            {
                const old = menu
                menu = new Menu(width, height)
                menu.button = old.button
                menu.changeGamePause(old.gamePaused)
                menu.relabelPauseSwitch()
            }
            function updateOrientation()
            {
                const portrait = isViewRotated()
                document.getElementById('stage').inert = portrait
                if (portrait) pauseRun()
            }
            window.addEventListener('resize', function() {
                updateOrientation()
                clearTimeout(resizeTimer)
                resizeTimer = setTimeout(onViewportResize, 100)
            })

            // Focus loss during an ad is reconciled when restarting.
            function pauseRun()
            {
                if (!bootComplete) return
                if (grapnel) {
                    grapnel.setGrappled(false)
                    grapnel.throwed = false
                }
                if (continueOffer.visible && continueOffer.adPending)
                    pauseAfterAd = true
                else if (!menu.gamePaused && !continueOffer.visible)
                    menu.startPause()
            }
            window.onblur = pauseRun
            // A hidden tab pauses
            document.addEventListener('visibilitychange', function() {
                const hidden = document.visibilityState == 'hidden'
                if (hidden)
                    pauseRun()
            })
            // Host pause pauses the run; resuming is left to the player
            PLATFORM.onPause(function(isPaused) {
                hostPaused = isPaused
                if (isPaused)
                    pauseRun()
                else if (bootComplete && !menu.opened() && !continueOffer.visible &&
                    !adOpen && !interstitialPending && !isViewRotated() &&
                    document.visibilityState !== 'hidden')
                    reuseTimeInGame()
            })
            PLATFORM.onAdState(function(state) {
                if (state == 'opened')
                    adOpen = true
                else if (state == 'closed' || state == 'failed')
                    adOpen = false
            })
            
        </script>
    </body>
</html>
