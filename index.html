<!Doctype html>
<html>
    <head>
        <title></title>
        <script src = "i18n.js"></script>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

        <style>
            body 
            {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: black;
            }
            body, canvas
            {
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                touch-action: none;
                -webkit-tap-highlight-color: transparent;
            }
            /* Game canvas and letterbox bars; turned to landscape on an upright
               phone (configureStage). Fixed children are placed in it. */
            #stage
            {
                position: fixed;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                transform-origin: center center;
            }
            /* Letterbox bars behind the game canvas (placed by configureWindowBackground) */
            .window-bar
            {
                position: fixed;
                pointer-events: none;
            }
            #loading
            {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: black;
                color: white;
                font-family: sans-serif;
                z-index: 1;
            }
            #loading[hidden]
            {
                display: none;
            }
            #loading-title
            {
                font-size: 48px;
            }
            #loading-progress
            {
                margin-top: 16px;
                font-size: 20px;
                color: #aaa;
            }
        </style>
    </head>
    <body>
        <div id = "loading">
            <div id = "loading-title" data-i18n = "game.title"></div>
            <div id = "loading-progress" data-i18n = "loading.initial"></div>
        </div>
        <script>I18N.applyDom()</script>
        <div id = "stage">
            <canvas class = "window-bar" hidden></canvas>
            <canvas class = "window-bar" hidden></canvas>
            <canvas id = "canvas"></canvas>
        </div>
        <script src = "gameoptions.js"></script>
        <script src = "style.js"></script>
        <script src = "render/glowsprites.js"></script>
        <script src = "platform.js"></script>
        <script src = "progress.js"></script>
        <script src = 'menu.js'></script>
        <script src = "languagebutton.js"></script>
    
        <script src = "collision/circlewithcircle.js"></script>
        <script src = "collision/linewithline.js"></script>
        <script src = "collision/circlewithline.js"></script>
        <script src = "collision/broadphase.js"></script>
        
        <script src = "elements/factory.js"></script>
        <script src = "render/culling.js"></script>
        <script src = "sprites/floor.js"></script>
        
        <script src = "sprites/empty.js"></script>
        <script src = "sprites/element.js"></script>
        
        <script src = "sprites/ninja.js"></script>
        <script src = "sprites/grapnel.js"></script>
        
        <script src = "sprites/rect.js"></script>
        <script src = "sprites/jumpingcube.js"></script>
        
        <script src = "sprites/scoretext.js"></script>

        <script src = "sprites/triangle.js"></script>
        <script src = "sprites/trampoline.js"></script>
        <script src = "sprites/side.js"></script>
        <script src = "sprites/leftwall.js"></script>
        
        <script src = "physics.js"></script>
        <script src = "respawn.js"></script>
        
        <script src = "moveScreen.js"></script>
        
        <script src = "render/effects.js"></script>
        <script src = "render/draw.js"></script>
        
        <script src = "events.js"></script>
        <script>
            'use strict'
            let canvas = document.getElementById('canvas')
            let ctx = canvas.getContext('2d', {alpha: false})
            let ok = false
            let time
            ctx.lineCap = 'butt'
            let trackEnabled = true
            let fpsCounter = new FpsCounter()
            let menu = new Menu(width, height)
            let continueOffer = new ContinueOffer(width, height, watchAdToContinue, restartFromOffer)
            let continueUsed = false
            // A pause request (hidden tab, focus loss) while the rewarded
            // ad plays: applied once the ad respawns the ninja
            let pauseAfterAd = false
            // A full-screen ad is on top: gameplay and input are frozen
            let adOpen = false
            // The run ended in a death: leaving it (Restart, Menu) shows an
            // interstitial first; a continue respawn clears it
            let runOver = false
            // An interstitial was requested: gameplay and input wait for it
            let interstitialPending = false
            let lastInterstitialAt = null
            let ninja, grapnel, floors, elementsFactory, screen, version, visualEffects, firstCycleInThisTick = true, unTouch = false
            const physicsTiming = {lastFrameTime: 0, accumulatorMs: 0}
            
            let game
            
            boot()
            
            // Platform init -> one storage read -> first menu frame -> hide
            // the loading overlay -> game_ready. Input is attached only
            // after that, so earlier clicks and keys are ignored.
            async function boot()
            {
                setLoadingProgress(I18N.t('loading.connecting'))
                await PLATFORM.init()
                // Platform language until the saved choice is read
                I18N.language = I18N.pick(null, PLATFORM.language)
                setLoadingProgress(I18N.t('loading.progress'))
                PROGRESS.load(await PLATFORM.storage.getMany(PROGRESS.keys))
                I18N.language = I18N.pick(PROGRESS.getLang(), PLATFORM.language)
                applyLanguage()
                setLoadingProgress(I18N.t('loading.starting'))
                await nextFrame()
                start()
                await nextFrame()
                document.getElementById('loading').hidden = true
                createEvents()
                PLATFORM.gameReady()
            }
            function setLoadingProgress(text)
            {
                document.getElementById('loading-progress').textContent = text
            }
            function nextFrame()
            {
                return new Promise(resolve => requestAnimationFrame(resolve))
            }
            
            function startGame(_v)
            {
                reuseTimeInGame()
                resetPhysicsTiming()
                trackEnabled = true
                version = _v
                visualEffects.background.randomSequenceScenes = 0
                visualEffects.screenEffects.landings.length = 0

                chooseVersion()
                warmGlowSprites()
                
                cancelAnimationFrame(game)
                game = requestAnimationFrame(gameLoop)
            }
            function chooseVersion()
            {
                firstCycleInThisTick = true
                continueUsed = false
                runOver = false
                pauseAfterAd = false
                scoreText.recordAnnounced = false
                continueOffer.hide()
                checkAdsAvailable()
                
                layoutHud()
                
                scoreText.count[version] = 0
                menu.setVisible(false)
                PLATFORM.sendLifecycle('level_started', {world: version})
                
                if (version == 'classic')
                    startClassicVersion()
                else if (version == 'bad')
                    startBadVersion()
                else
                    console.log('error version in startGame()')
            }
            // Width-derived HUD values: score text and the menu button.
            function layoutHud()
            {
                scoreText.x         = scoreTextX()      / scale[version]
                scoreText.rx        = scoreTextRx()     / scale[version]
                scoreText.y         = scoreTextY        / scale[version]
                scoreText.fontSize  = getHudFontSize(width / scale[version], height / scale[version], version)
                const menuButtonLayout = getHudMenuButtonLayout(
                    width / scale[version],
                    height / scale[version],
                    version,
                    {
                        x: menu.constButton.x / scale[version],
                        y: menu.constButton.y / scale[version],
                        width: menu.constButton.width / scale[version],
                        height: menu.constButton.height / scale[version]
                    }
                )
                // A touch target (44 CSS px) on phones, kept inside the corner
                const viewWidth = width / scale[version]
                const margin = LANGUAGE_BUTTON.marginRatio * height / scale[version]
                const size = Math.max(menuButtonLayout.width, minTouchSize() / scale[version])

                menu.button = new Button(
                {
                    x       : Math.min(menuButtonLayout.x, viewWidth - margin - size / 2),
                    y       : Math.max(menuButtonLayout.y, margin + size / 2),
                    width   : size,
                    height  : size,
                    fill    : menu.constButton.fill,
                    stroke  : menu.constButton.stroke
                },
                ...menu.args)
            }
            function reStart()
            {
                PROGRESS.save()
                if (visualEffects && ninja && screen)
                {
                    visualEffects.screenEffects.triggerDeath(ninja.x + screen.x, ninja.y + screen.y)
                    visualEffects.background.randomSequenceScenes = 0
                }
                chooseVersion()
            }
            // A death is waiting on the continue offer or the interstitial
            function isRunFrozen()
            {
                return continueOffer.visible || interstitialPending
            }
            // Lethal hits: offer one continue per run from CONTINUE_MIN_SCORE
            // when rewarded ads exist, otherwise restart instantly. The offer
            // freezes physics. Without ads (the local adapter): always restart.
            function onLethalDeath()
            {
                if (continueOffer.visible || ninja.isInvulnerable() || interstitialPending)
                    return
                runOver = true
                if (!PLATFORM.isRewardedSupported() || continueUsed ||
                    scoreText.count[version] < CONTINUE_MIN_SCORE)
                {
                    leaveFinishedRun(reStart)
                    return
                }
                PROGRESS.save()
                continueOffer.show()
            }
            // Run start: without rewarded ads the offer would hold only
            // Restart plus an "Ads unavailable" notice (it is never shown then).
            function checkAdsAvailable()
            {
                continueOffer.setAdsAvailable(PLATFORM.isRewardedSupported())
            }
            // One rewarded ad per continue and at most one continue per run.
            // Input stays ignored (both buttons disabled, physics frozen by
            // the visible offer) until the SDK answers.
            function watchAdToContinue()
            {
                if (continueUsed || continueOffer.adPending || !continueOffer.watchVisible())
                    return
                continueUsed = true
                pauseAfterAd = false
                continueOffer.setAdPending(true)
                // The game stays frozen behind the offer
                PLATFORM.requestRewarded('continue').then(result =>
                {
                    if (!continueOffer.adPending)
                        return
                    if (result.status === 'rewarded')
                    {
                        continueOffer.setAdPending(false)
                        continueRun()
                    }
                    // No reward: keep the score on the offer, Restart only
                    else
                        continueOffer.showAdError()
                })
            }
            // Keeps score, version, floors and screen; the ninja respawns at
            // rest at a safe point with temporary invulnerability.
            function continueRun()
            {
                continueUsed = true
                runOver = false
                continueOffer.hide()
                respawnNinja()
                resetPhysicsTiming()
                if (pauseAfterAd || document.visibilityState == 'hidden')
                {
                    pauseAfterAd = false
                    menu.startPause()
                }
            }
            function restartFromOffer()
            {
                leaveFinishedRun(function()
                {
                    continueOffer.hide()
                    reStart()
                    resetPhysicsTiming()
                })
            }
            // Game over interstitial: after a death, never mid-run, at most
            // once per PLATFORM.interstitialMinGapMs. next() runs once the
            // ad is closed, failed or skipped.
            function leaveFinishedRun(next)
            {
                if (interstitialPending)
                    return
                // A death without a continue ends the run
                if (runOver)
                    PLATFORM.sendLifecycle('level_failed', {world: version})
                const now = PLATFORM.now()
                const recent = lastInterstitialAt !== null &&
                    now - lastInterstitialAt < PLATFORM.interstitialMinGapMs
                if (!runOver || recent || !PLATFORM.isInterstitialSupported())
                {
                    runOver = false
                    next()
                    return
                }
                runOver = false
                interstitialPending = true
                PLATFORM.showInterstitial('game_over').then(result =>
                {
                    interstitialPending = false
                    if (result === 'closed')
                        lastInterstitialAt = PLATFORM.now()
                    next()
                })
            }
            function startClassicVersion()
            {
                screen = new Screen(false)
                
                elementsFactory = new ElementsFactory
                floors =
                [
                    new SideFloor(0, 0.1 * height, [{type: 'side', chance: 100}]),
                    new Floor(0.1 * height, 0.9 * height, {min: 0.35 * width, max: 0.45 * width},
                    [
                        {type: 'verticalPairRects', chance: 35 },// 40 35 25
                        {type: 'harmlessTriangle', chance: 10},
                        {type: 'trampoline', chance: 30},
                        {type: 'twoTrampolines', chance: 25}
                    ]),
                    new SideFloor(0.9 * height, height, [{type: 'side', chance: 100}])
                ]
                
                ninja = new Ninja(
                {
                    x: 0.2 * width,
                    y: 0.2 * height,
                    radius: 0.01 * height,
                    fill: STYLE.colors.player.fill,
                    stroke: STYLE.colors.player.stroke
                })
                grapnel = new Grapnel(
                {
                    points: [0, 0, 0, 0],
                    stroke: STYLE.colors.player.cyan
                })

                
                for (let i = 0; i < floors.length; ++i)
                {
                    floors[i].generatePrimaryElements()
                }
            }
            function startBadVersion()
            {
                screen = new Screen(false, 0)
                
                elementsFactory = new ElementsFactory
                floors =
                [
                    new SideFloor(2 * height, 2.2 * height, [{type: 'ground', chance: 100}]),
                    new Floor(0.2 * height, 2 * height, {min: 0, max: 0}, [
                        {type: 'frame1Elements', chance: 6},
                        {type: 'frame3Triangle', chance: 6},
                        {type: 'frame4Elements', chance: 6},
                        {type: 'frame5Rects', chance: 5},
                        {type: 'frame6Rects', chance: 5},
                        {type: 'frame7Elements', chance: 6},
                        {type: 'frame8Elements', chance: 5},
                        {type: 'frame10Elements', chance: 5},
                        {type: 'frame11Elements', chance: 5},
                        {type: 'frame12Elements', chance: 6},
                        {type: 'frame13Elements', chance: 6},
                        {type: 'frame14Rects', chance: 5}
                    ], 1),
                    new SideFloor(0, 0.2 * height, [{type: 'side', chance: 100}])
                ]
                ninja = new Ninja(
                {
                    x: 0.2 * width,
                    y: 1.2 * height,
                    radius: 0.01 * height,
                    fill: STYLE.colors.player.fill,
                    stroke: STYLE.colors.player.stroke
                })
                grapnel = new Grapnel(
                {
                    points: [0, 0, 0, 0],
                    stroke: STYLE.colors.player.cyan
                })

                
                for (let i = 0; i < floors.length; ++i)
                {
                    floors[i].generatePrimaryElements()
                }
                
                const screenMargin = 0.1 * height
                screen.min = -(1.9 * height - height + screenMargin)
                screen.max = -(0 - screenMargin)
            }
            function start()
            {
                configureCanvasViewport(canvas, ctx)
                configureWindowBackground()
                visualEffects = new VisualEffects(ctx, canvas)
                
                //generatePrimaryElements()
                menu.draw()
                game = requestAnimationFrame(gameLoop)
            }

            function resetPhysicsTiming()
            {
                physicsTiming.lastFrameTime = 0
                physicsTiming.accumulatorMs = 0
            }

            function gameLoop(frameTime)
            {
                fpsCounter.frame(frameTime)

                if (menu.visible)
                {
                    resetPhysicsTiming()
                    menu.draw()
                }
                else if (menu.gamePaused)
                {
                    resetPhysicsTiming()
                    menu.pause()
                }
                else if (continueOffer.visible)
                {
                    resetPhysicsTiming()
                    draw()
                    continueOffer.draw()
                }
                else if (adOpen || interstitialPending)
                {
                    resetPhysicsTiming()
                    draw()
                }
                else
                {
                    runFixedPhysics(frameTime)
                    draw()
                }
                game = requestAnimationFrame(gameLoop)
            }

            function runFixedPhysics(frameTime)
            {
                for (let steps = computePhysicsSteps(physicsTiming, frameTime); steps > 0; steps--)
                    physics()
            }

            // Live re-layout when the iframe resizes (fullscreen toggle,
            // window resize). The current run keeps going: only width-derived
            // values are recomputed; the logical height (and physics) is fixed.
            let resizeTimer = null
            function onViewportResize()
            {
                resizeTimer = null
                const oldWidth = width
                updateLogicalViewport()
                configureCanvasViewport(canvas, ctx)
                configureWindowBackground()
                ctx.lineCap = 'butt'
                rebuildMenu()
                continueOffer.layout(width, height)

                if (version && screen)
                {
                    screen.updateWidthLayout()
                    screen.leftWall.update(screen)
                    layoutHud()
                    // Factories capture width-derived sizes; they hold no run state.
                    elementsFactory = new ElementsFactory
                    for (let i = 0; i < floors.length; ++i)
                        floors[i].rescaleSpacing(width / oldWidth)
                }

                if (menu.visible)
                    menu.draw()
                else if (menu.gamePaused)
                {
                    draw()
                    menu.drawPauseScreen()
                }
            }
            // Menu toggle: switch now, re-lay out every screen, save the choice
            function setLanguage(lang)
            {
                I18N.language = lang
                applyLanguage()
                PROGRESS.setLang(I18N.language)
                PROGRESS.save()
                if (menu.visible)
                    menu.draw()
            }
            // Text in the current language everywhere: page, menu, offer
            function applyLanguage()
            {
                I18N.applyDom()
                document.documentElement.lang = I18N.language
                rebuildMenu()
                continueOffer.relabel(width, height)
            }
            // A new Menu at the new size that keeps the current menu state;
            // its texts come from the current language and progress.
            function rebuildMenu()
            {
                const old = menu
                menu = new Menu(width, height)
                menu.button = old.button
                menu.setVisible(old.visible)
                menu.changeGamePause(old.gamePaused)
            }
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer)
                resizeTimer = setTimeout(onViewportResize, 100)
            })

            // Focus loss and a hidden tab pause the run; during the rewarded
            // ad the pause waits for the respawn
            function pauseRun()
            {
                if (continueOffer.visible && continueOffer.adPending)
                    pauseAfterAd = true
                else if (!menu.visible && !menu.gamePaused && !continueOffer.visible)
                    menu.startPause()
            }
            window.onblur = pauseRun
            // A hidden tab pauses
            document.addEventListener('visibilitychange', function() {
                const hidden = document.visibilityState == 'hidden'
                if (hidden)
                    pauseRun()
            })
            // Host pause pauses the run; resuming is left to the player
            PLATFORM.onPause(function(isPaused) {
                if (isPaused)
                    pauseRun()
            })
            PLATFORM.onAdState(function(state) {
                if (state == 'opened')
                    adOpen = true
                else if (state == 'closed' || state == 'failed')
                    adOpen = false
            })
            
        </script>
    </body>
</html>
